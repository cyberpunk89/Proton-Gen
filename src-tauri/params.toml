# protongen parameter catalog
# Catalog for Proton 11.0 / proton-cachyos 11.0-20260703  —  updated 2026-08-19
#
# Sources (refresh with the /update-proton-params Claude skill):
#   - https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md
#   - https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/CHANGELOG.md
#   - https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md
#   - https://wiki.cachyos.org/configuration/gaming/
#   - https://deepwiki.com/HansKristian-Work/vkd3d-proton/8.4-environment-variables
#   - https://github.com/doitsujin/dxvk
#
# Two tables:
#   [[wrapper]]  programs placed BEFORE the target (%command% or umu-run)
#   [[env]]      KEY=value environment variables, grouped by `category`
#
# Fields:
#   key            env var name, or wrapper command
#   label          friendly name (wrappers; optional for env)
#   kind           wrapper only: "plain" | "gamescope"
#   category       env only: section heading in the UI
#   default_value  prefilled value (env) / args (gamescope)
#   values         optional list of suggested values (combo box)
#   requires       optional: binary that must be on PATH (drives installed/missing badge)
#   gpu            optional relevance hint: nvidia | amd | intel | any
#   needs          optional capabilities: wayland | kde | ntsync | hdr | fsr4 | rdna3 | rdna4
#                  The last four are opt-in (Settings): `hdr` from its toggle,
#                  and fsr4/rdna3/rdna4 derived from the AMD generation selector
#                  — `fsr4` means either generation, rdna3/rdna4 are exclusive.
#                  Entries not matching are hidden until "Show all".
#   help           one-line description

# Records the proton-cachyos build this catalog was last refreshed against.
# The app compares it to your installed build and shows a banner when newer.
# The /update-proton-params skill bumps this when it refreshes the catalog.
[meta]
proton_cachyos_build = "20260703"
updated = "2026-08-19"

# ============================ Wrappers ============================

[[wrapper]]
key = "game-performance"
label = "Game Performance (CachyOS)"
kind = "plain"
requires = "game-performance"
help = "CachyOS wrapper: performance power profile + gaming scheduler for the game's lifetime."
details = "CachyOS's native gaming wrapper, the modern replacement for gamemoderun on CachyOS. Switches power-profiles-daemon to the 'performance' profile and activates the CachyOS sched-ext gaming scheduler (e.g. scx_lavd) for the duration of the game, restoring the previous settings on exit. Pick this over gamemoderun on CachyOS; don't stack both."
example = "game-performance %command%"
url = "https://wiki.cachyos.org/configuration/gaming/"

[[wrapper]]
key = "gamemoderun"
label = "GameMode"
kind = "plain"
requires = "gamemoderun"
help = "Feral GameMode: applies CPU governor / scheduling optimizations while gaming."
details = "Feral GameMode daemon applies CPU governor, I/O priority, process niceness, and kernel scheduler optimizations while the game runs. Particularly beneficial for systems with Intel/AMD powersave governors that throttle performance; trades power savings for consistent FPS during gameplay."
example = "gamemoderun %command%"
url = "https://github.com/FeralInteractive/gamemode#requesting-gamemode"

[[wrapper]]
key = "mangohud"
label = "MangoHud"
kind = "plain"
requires = "mangohud"
help = "MangoHud: in-game FPS / frametime / temperature / load overlay."
details = "Real-time performance overlay showing FPS, frame times, CPU/GPU temps, load percentages, and memory usage. Works with both Vulkan and OpenGL with minimal performance overhead. Highly configurable via MANGOHUD_CONFIG environment variable; use for gameplay monitoring or benchmarking."
example = "mangohud %command%"
url = "https://github.com/flightlessmango/MangoHud#normal-usage"

[[wrapper]]
key = "gamescope"
label = "Gamescope"
kind = "gamescope"
default_value = "-f"
requires = "gamescope"
help = "Micro-compositor. Edit args, e.g. '-W 2560 -H 1440 -f -F fsr -r 144'."
details = "Micro-compositor that runs games in a sandboxed Wayland session with optional upscaling (integer/FSR/NIS), frame rate limiting, and windowing control. Reduces latency via async compute and DRM direct flipping. Useful for exotic displays (ultrawide, multi-monitor) or isolating unstable games from the desktop."
example = "gamescope -f -W 1920 -H 1080 -r 60 -- %command%"
url = "https://github.com/ValveSoftware/gamescope#options"

# ====================== Performance / Sync =======================

[[env]]
key = "PROTON_NO_NTSYNC"
needs = ["ntsync"]
category = "Performance / Sync"
default_value = "1"
values = ["1", "0"]
help = "Disable kernel ntsync (on by default in Proton 11); set 1 to fall back to fsync/esync."
details = "Kernel ntsync synchronization primitives are enabled by default in Proton 11 / proton-cachyos for faster game launch and execution. The old PROTON_USE_NTSYNC enable knob was removed; the only remaining toggle is PROTON_NO_NTSYNC. Set 1 to disable ntsync and fall back to fsync/esync — do this only if a game has compatibility issues with ntsync."
example = "PROTON_NO_NTSYNC=1 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

[[env]]
key = "PROTON_DXVK_GPLASYNC"
category = "Performance / Sync"
default_value = "1"
values = ["1", "0"]
help = "CachyOS: enable the gplasync DXVK fork to cut shader stutter (UNSAFE for anti-cheat)."
details = "Swaps in CachyOS's gplasync DXVK fork, which compiles pipelines asynchronously to reduce shader-compilation stutter on first encounter. It can trip kernel-level anti-cheat, so do NOT use it in EAC/BattlEye multiplayer titles — prefer PROTON_DXVK_LOWLATENCY there. CachyOS-Proton only; mutually exclusive with the low-latency fork."
example = "PROTON_DXVK_GPLASYNC=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "PROTON_NO_FSYNC"
tier = "advanced"
category = "Performance / Sync"
default_value = "1"
values = ["1", "0"]
help = "Disable fsync (futex-based sync). Troubleshooting only."
details = "Disables futex-based in-process synchronization primitives (fsync), which normally provides better performance than older sync methods. Automatically disabled on systems lacking FUTEX_WAIT_MULTIPLE kernel support; use only to troubleshoot games with fsync-related issues."
example = "PROTON_NO_FSYNC=1 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

[[env]]
key = "PROTON_FORCE_LARGE_ADDRESS_AWARE"
tier = "advanced"
category = "Performance / Sync"
default_value = "1"
values = ["1", "0"]
help = "Force 32-bit games to use >2GB address space (fixes some crashes)."
details = "Forces Wine to enable the LARGE_ADDRESS_AWARE flag for all 32-bit executables, allowing them to use more than 2GB of address space. Enabled by default in Proton and fixes crashes in games that require more memory than the 32-bit default limit allows."
example = "PROTON_FORCE_LARGE_ADDRESS_AWARE=1 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

[[env]]
key = "PROTON_HEAP_DELAY_FREE"
tier = "advanced"
category = "Performance / Sync"
default_value = "1"
values = ["1", "0"]
help = "Delay heap frees to work around use-after-free bugs in some games."
details = "Delays the freeing of heap memory to work around use-after-free bugs in some games that incorrectly access freed memory. Enabled by default to improve compatibility; disable only if a game has crashes or memory-related issues that are specifically caused by this workaround."
example = "PROTON_HEAP_DELAY_FREE=1 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

[[env]]
key = "PROTON_DXVK_LOWLATENCY"
category = "Performance / Sync"
default_value = "1"
values = ["1", "0"]
help = "CachyOS: use the low-latency DXVK fork for better frame pacing / input lag."
details = "Swaps in CachyOS's low-latency DXVK fork, which adds frame-pacing improvements to reduce input lag. Helpful for fast-paced or competitive games; disable if you see artifacts or regressions. CachyOS-Proton only."
example = "PROTON_DXVK_LOWLATENCY=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "LOW_LATENCY_LAYER"
tier = "advanced"
category = "Performance / Sync"
default_value = "1"
values = ["1", "0"]
help = "CachyOS: enable the open-source low_latency_layer (Reflex-like latency reduction)."
details = "Enables the open-source low_latency_layer, a vendor-neutral latency-reduction layer (similar in spirit to NVIDIA Reflex) added in proton-cachyos 11.0-20260519. Reduces render-queue latency in supported titles. Pair with DXVK_NVAPI_VKREFLEX for NVIDIA Reflex games."
example = "LOW_LATENCY_LAYER=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "PROTON_VKD3D_LOWLATENCY"
tier = "advanced"
category = "Performance / Sync"
default_value = "1"
values = ["1", "0"]
help = "CachyOS: enable the vkd3d-low-latency fork for better D3D12 frame pacing / input lag."
details = "CachyOS-specific (added 11.0-20260703): swaps in the vkd3d-low-latency fork, giving hardware-agnostic low-latency frame pacing for D3D12 titles — the VKD3D counterpart to PROTON_DXVK_LOWLATENCY. It natively implements the NVIDIA Reflex API inside the translation layer (bypassing conversion into VK_NV_low_latency2) and adds advanced frame pacing via waitable DXGI swapchains to cut input lag; AMD users should check the upstream discussion for caveats first. Disable if you see artifacts or regressions. CachyOS-Proton only."
example = "PROTON_VKD3D_LOWLATENCY=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/CHANGELOG.md"

# ======================== Render backend ========================

[[env]]
key = "PROTON_USE_WINED3D"
category = "Render backend"
default_value = "1"
values = ["1", "0"]
help = "Use OpenGL-based wined3d instead of Vulkan DXVK/VKD3D. Rarely needed."
details = "Forces Direct3D 9, 10, and 11 games to use the OpenGL-based wined3d renderer instead of the faster Vulkan-based DXVK. Useful for older integrated GPUs with poor Vulkan support, or as a last resort if a game has rendering bugs with DXVK."
example = "PROTON_USE_WINED3D=1 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md#runtime-config-options"

[[env]]
key = "PROTON_NO_D3D12"
tier = "advanced"
category = "Render backend"
default_value = "1"
values = ["1", "0"]
help = "Disable VKD3D-Proton (D3D12). Forces D3D11 path where possible."
details = "Disables Direct3D 12 support (vkd3d-proton) and forces affected games to use the D3D11 rendering path instead. This can work around D3D12-specific bugs, but may reduce performance or change visual quality in some titles."
example = "PROTON_NO_D3D12=1 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md#runtime-config-options"

[[env]]
key = "PROTON_NO_D3D11"
tier = "advanced"
category = "Render backend"
default_value = "1"
values = ["1", "0"]
help = "Disable DXVK for D3D11."
details = "Disables Direct3D 11 support via DXVK; affected games fall back to the D3D9 rendering path instead. Useful for D3D11 games that have compatibility issues with DXVK but run correctly under wined3d or DXVK's D3D9 path."
example = "PROTON_NO_D3D11=1 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md#runtime-config-options"

[[env]]
key = "PROTON_NO_D3D10"
tier = "advanced"
category = "Render backend"
default_value = "1"
values = ["1", "0"]
help = "Disable DXVK for D3D10."
details = "Disables Direct3D 10 and DXGI support (both required together); games that request D3D10 will fall back to D3D9 instead. Rarely needed, but can work around D3D10-specific compatibility issues in legacy or niche titles."
example = "PROTON_NO_D3D10=1 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md#runtime-config-options"

[[env]]
key = "PROTON_NO_D3D9"
tier = "advanced"
category = "Render backend"
default_value = "1"
values = ["1", "0"]
help = "Disable DXVK for D3D9 (falls back to wined3d)."
details = "Disables Direct3D 9 support, forcing those games to use the OpenGL-based wined3d fallback path instead of DXVK. Enable only if a D3D9 game exhibits rendering or performance issues with DXVK but works with wined3d."
example = "PROTON_NO_D3D9=1 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md#runtime-config-options"

[[env]]
key = "PROTON_DXVK_D3D8"
tier = "advanced"
category = "Render backend"
default_value = "1"
values = ["1", "0"]
help = "Use DXVK's native d3d8 implementation for Direct3D 8 games."
details = "Routes Direct3D 8 games through DXVK's native d3d8.dll instead of the d3d8-to-d3d9 wrapper, improving compatibility and performance for older titles. Enable for DX8-era games that misbehave on the default path."
example = "PROTON_DXVK_D3D8=1 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

[[env]]
key = "PROTON_DXVK_SAREK"
tier = "advanced"
category = "Render backend"
default_value = "auto"
values = ["auto", "1", "0"]
help = "CachyOS: dxvk-sarek fork for older GPUs lacking Vulkan 1.3 (auto/1/0)."
details = "Replaces DXVK with the dxvk-sarek fork, which targets older GPUs (Vulkan 1.1-1.2) that don't properly support Vulkan 1.3. As of 11.0-20260602 it accepts 'auto' (the default — fall back to sarek only when the GPU lacks Vulkan 1.3), '1' (force on), or '0' (force off). Set 1 if a game fails to start with a Vulkan 1.3 / feature-level error on legacy hardware. CachyOS-Proton only."
example = "PROTON_DXVK_SAREK=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "PROTON_D7VK_DDRAW"
tier = "advanced"
category = "Render backend"
default_value = "1"
values = ["1", "0"]
help = "CachyOS: use D7VK's ddraw.dll for DirectX 7-or-lower games."
details = "Provides a Vulkan-backed ddraw.dll (D7VK) for very old DirectX 7-and-earlier games, improving rendering over Wine's builtin. Enable for retro titles with 2D / early-3D rendering issues. CachyOS-Proton only."
example = "PROTON_D7VK_DDRAW=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "FNA3D_FORCE_DRIVER"
tier = "advanced"
category = "Render backend"
default_value = "D3D11"
values = ["D3D11", "Vulkan", "OpenGL"]
help = "Force the FNA3D backend for FNA/XNA games (set D3D11 to route through DXVK)."
details = "FNA-based games (many indie titles — Stardew Valley, Celeste, Terraria, FEZ) render through FNA3D, which normally picks Vulkan. Setting D3D11 routes FNA through Wine's d3d11 → DXVK instead, which can fix rendering glitches, black screens, or crashes on drivers where FNA3D's own Vulkan path misbehaves. Leave unset for the default auto-selection; only override for a misbehaving FNA game."
example = "FNA3D_FORCE_DRIVER=D3D11 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md#runtime-config-options"

# ============= Upscaling / frame-gen  +  NVIDIA ==================
# Two categories, deliberately: every upscaler knob used to live under a
# heading called "NVIDIA / Upscaling", so an AMD user navigating to their
# FSR options landed on a nav row labelled NVIDIA — with the actual NVIDIA
# entries hidden by the `gpu` filter, the label described nothing on screen.

[[env]]
key = "PROTON_DISABLE_NVAPI"
tier = "advanced"
gpu = "nvidia"
category = "NVIDIA"
default_value = "1"
values = ["1", "0"]
help = "Disable NVIDIA's NVAPI GPU support library (on by default; troubleshooting only)."
details = "NVAPI (via DXVK-NVAPI) is enabled automatically on NVIDIA GPUs, giving games access to DLSS Super Resolution, Reflex, and other NVIDIA-specific features. Set this to disable it — useful only if a game crashes or misbehaves specifically because of NVAPI being present. This replaced the older opt-in PROTON_ENABLE_NVAPI naming; the real Proton 11.0 toggle is opt-out."
example = "PROTON_DISABLE_NVAPI=1 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

[[env]]
key = "PROTON_FORCE_NVAPI"
tier = "advanced"
gpu = "nvidia"
category = "NVIDIA"
default_value = "1"
values = ["1", "0"]
help = "Force NVAPI on even when Proton's own heuristics would normally disable it."
details = "Forces NVAPI to load even in situations where Proton's detection would otherwise disable it (e.g. an unusual or unrecognized NVIDIA driver setup). Internally also relaxes DXVK-NVAPI's driver-version/allow-other-drivers checks. Advanced troubleshooting toggle for NVAPI-dependent features (DLSS, Reflex) that fail to activate despite a genuine NVIDIA GPU."
example = "PROTON_FORCE_NVAPI=1 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

[[env]]
key = "DXVK_ENABLE_NVAPI"
gpu = "nvidia"
category = "NVIDIA"
default_value = "1"
values = ["1", "0"]
help = "Let DXVK expose NVAPI (NVAPI is on by default on NVIDIA)."
details = "Tells DXVK to expose NVAPI entry points to games. This variable specifically controls whether DXVK disables its internal nvapiHack (a compatibility workaround), allowing the full DXVK-NVAPI implementation to be used. Enable (1) for NVAPI game support; disable (0) only for troubleshooting. Has no effect if NVAPI itself is turned off via PROTON_DISABLE_NVAPI."
example = "DXVK_ENABLE_NVAPI=1 %command%"
url = "https://github.com/doitsujin/dxvk/blob/master/README.md"

[[env]]
key = "PROTON_HIDE_NVIDIA_GPU"
tier = "advanced"
gpu = "nvidia"
category = "NVIDIA"
default_value = "1"
values = ["1", "0"]
help = "Hide the NVIDIA GPU from the game (forces fallback paths)."
details = "Forces the game to report the GPU as AMD instead of NVIDIA, causing the game to use fallback rendering paths instead of NVIDIA-specific code. Useful for troubleshooting when games have Windows-only NVIDIA driver dependencies that break on Linux, or when NVIDIA-specific paths are causing crashes. Enable only if the game runs better without NVIDIA detection."
example = "PROTON_HIDE_NVIDIA_GPU=1 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

[[env]]
key = "PROTON_DLSS_UPGRADE"
gpu = "nvidia"
category = "Upscaling & frame-gen"
default_value = "1"
values = ["1", "0"]
help = "Auto-upgrade the game's DLSS DLL to the latest version."
details = "Automatically downloads and installs the latest available nvngx_dlss(d|g).dll for a game, replacing the bundled version. This ensures you get performance improvements and bug fixes from newer DLSS versions without waiting for game updates. Set to a specific version (e.g., '310.2') to pin one, or '1' for the latest; also sets DXVK_NVAPI_DRS_SETTINGS to the latest preset unless you override it yourself."
example = "PROTON_DLSS_UPGRADE=310.2 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/CHANGELOG.md"

[[env]]
key = "PROTON_DLSS_INDICATOR"
gpu = "nvidia"
category = "Upscaling & frame-gen"
default_value = "1"
values = ["1", "0"]
help = "Show the DLSS overlay indicator (confirms DLSS version in use)."
details = "Shows an overlay indicator in the bottom-left corner of the screen displaying which version of DLSS is active in the game. Useful for confirming that DLSS is enabled and which version is running. The indicator appears automatically without any additional configuration beyond setting this to 1."
example = "PROTON_DLSS_INDICATOR=1 %command%"
url = "https://github.com/jp7677/dxvk-nvapi/blob/master/README.md"

[[env]]
key = "PROTON_FSR4_UPGRADE"
gpu = "amd"
needs = ["fsr4"]
category = "Upscaling & frame-gen"
default_value = "1"
values = ["1", "0"]
help = "CachyOS: upgrade the game's FSR to FSR 4 (accepts 4.0.0 / 4.1.1). Works on RDNA3 & RDNA4."
details = "CachyOS-specific: automatically upgrades AMD FidelityFX Super Resolution to FSR 4, improving image quality and scaling. As of 11.0-20260702 the required amdxcffx64.dll is always copied in, so this only accepts '4.0.0' or '4.1.1' (or '1' for the latest) by default; with PROTON_USE_OPTISCALER enabled it accepts the same wider version range as PROTON_FFX4_UPGRADE. The separate PROTON_FSR4_RDNA3_UPGRADE knob was removed — this variable now covers both RDNA3 and RDNA4 (pair with PROTON_MLFG_UPGRADE for frame generation)."
example = "PROTON_FSR4_UPGRADE=4.1.1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/CHANGELOG.md"

[[env]]
key = "PROTON_FFX4_UPGRADE"
gpu = "amd"
needs = ["fsr4"]
category = "Upscaling & frame-gen"
default_value = "1"
values = ["1", "0"]
help = "CachyOS: FidelityFX 4 auto-upgrade (newer naming; use latest or pin a version)."
details = "CachyOS-specific: controls the FidelityFX SDK dll version under the newer FFX naming scheme (companion to PROTON_FFX3_UPGRADE). Since 11.0-20260702 the amdxcffx64.dll is always copied in, so this and PROTON_FSR4_UPGRADE both work without OptiScaler; with PROTON_USE_OPTISCALER enabled, PROTON_FSR4_UPGRADE also gains the ability to set this same version. Set '1' for the latest or a version string to pin one. CachyOS-Proton only."
example = "PROTON_FFX4_UPGRADE=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "PROTON_XESS_UPGRADE"
category = "Upscaling & frame-gen"
default_value = "1"
values = ["1", "0"]
help = "CachyOS: auto-upgrade Intel XeSS to the latest version."
details = "CachyOS-specific: automatically downloads and installs the latest available Intel XeSS upscaling DLL for a game. Intel XeSS provides AI-powered upscaling similar to DLSS, optimized for Intel Arc GPUs but also compatible with other architectures. Enable (1) to get the latest version improvements and bug fixes."
example = "PROTON_XESS_UPGRADE=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/CHANGELOG.md"

[[env]]
key = "__NV_PRIME_RENDER_OFFLOAD"
tier = "advanced"
gpu = "nvidia"
category = "NVIDIA"
default_value = "1"
values = ["1", "0"]
help = "PRIME render offload: run the game on the NVIDIA dGPU (hybrid laptops)."
details = "Enables NVIDIA GPU offloading on hybrid laptops with both integrated and discrete NVIDIA graphics. When set to 1, the game will run exclusively on the NVIDIA dGPU instead of the integrated GPU, providing significantly better performance. This is an NVIDIA driver feature and only applies to systems with proper NVIDIA Optimus/Prime setup."
example = "__NV_PRIME_RENDER_OFFLOAD=1 %command%"
url = "https://docs.nvidia.com/datacenter/tesla/driver-installation-guide/index.html"

[[env]]
key = "__GLX_VENDOR_LIBRARY_NAME"
tier = "advanced"
gpu = "nvidia"
category = "NVIDIA"
default_value = "nvidia"
help = "PRIME offload GLX vendor; set with __NV_PRIME_RENDER_OFFLOAD on hybrid GPUs."
details = "Sets the OpenGL/GLX library vendor when using NVIDIA PRIME render offload on hybrid systems. Should typically be set to 'nvidia' when using __NV_PRIME_RENDER_OFFLOAD=1. This tells the system to use NVIDIA's GLX implementation instead of other vendors, ensuring proper GPU routing for OpenGL-based games."
example = "__GLX_VENDOR_LIBRARY_NAME=nvidia %command%"
url = "https://docs.nvidia.com/datacenter/tesla/driver-installation-guide/index.html"

[[env]]
key = "PROTON_FFX3_UPGRADE"
gpu = "amd"
needs = ["fsr4"]
category = "Upscaling & frame-gen"
default_value = "1"
values = ["1", "0"]
help = "CachyOS: upgrade a game's FSR to FSR 3.1 (adds frame generation). Was PROTON_FSR3_UPGRADE."
details = "Replaces a game's bundled AMD FSR with FSR 3.1, adding frame generation and improved upscaling where supported. Renamed from PROTON_FSR3_UPGRADE in 11.0-20260702 (you shouldn't need this under normal circumstances). Use as a stepping stone when a game can't run FSR 4. CachyOS-Proton only."
example = "PROTON_FFX3_UPGRADE=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "PROTON_FSR4_INDICATOR"
gpu = "amd"
needs = ["fsr4"]
category = "Upscaling & frame-gen"
default_value = "1"
values = ["1", "0"]
help = "CachyOS: show the FSR 4 watermark (top-left) to confirm it's active."
details = "Displays an FSR 4 watermark in the top-left corner so you can confirm the FSR4 upgrade is actually running — shorthand for setting FSR_WATERMARK=1 and FSR_FG_WATERMARK=1 directly. Purely diagnostic; turn it off once verified. CachyOS-Proton only."
example = "PROTON_FSR4_INDICATOR=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "PROTON_MLFG_UPGRADE"
gpu = "amd"
needs = ["fsr4"]
category = "Upscaling & frame-gen"
default_value = "1"
values = ["1", "0"]
help = "CachyOS: enable AMD multi-frame generation (needs amdxcffx64.dll >= 4.0.3)."
details = "Enables AMD multi-frame generation (MLFG) when the game's amdxcffx64.dll is >= 4.0.3; it is auto-enabled alongside FSR4 upgrades. Boosts perceived framerate via generated frames on supported AMD hardware. On RDNA3 it uses 'redstone' frame generation and additionally requires DXIL_SPIRV_CONFIG=wmma_rdna3_workaround. CachyOS-Proton only."
example = "PROTON_MLFG_UPGRADE=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "DXIL_SPIRV_CONFIG"
gpu = "amd"
needs = ["rdna3"]
category = "Upscaling & frame-gen"
default_value = "wmma_rdna3_workaround"
values = ["wmma_rdna3_workaround"]
help = "CachyOS: RDNA3 workaround required for FSR4 multi-frame generation (MLFG)."
details = "Applies the 'wmma_rdna3_workaround' to the DXIL→SPIR-V translation, which RDNA3 cards need in order to run FSR4 multi-frame generation (PROTON_MLFG_UPGRADE). Set this alongside PROTON_MLFG_UPGRADE=1 on RDNA3; it is unnecessary on RDNA4. CachyOS-Proton only."
example = "PROTON_MLFG_UPGRADE=1 DXIL_SPIRV_CONFIG=wmma_rdna3_workaround %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/CHANGELOG.md"

[[env]]
key = "PROTON_USE_OPTISCALER"
category = "Upscaling & frame-gen"
default_value = "1"
values = ["1", "0"]
help = "CachyOS: auto-inject OptiScaler to swap/force upscalers (DLSS/FSR/XeSS)."
details = "Automatically injects OptiScaler, which lets you replace or force a game's upscaler (e.g. expose FSR/XeSS where only DLSS exists, or vice-versa). Pair with PROTON_OPTISCALER_NAME to choose the injected DLL. CachyOS-Proton only (added 11.0-20260506)."
example = "PROTON_USE_OPTISCALER=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "PROTON_OPTISCALER_NAME"
category = "Upscaling & frame-gen"
default_value = "dxgi.dll"
values = ["dxgi.dll", "d3d12.dll", "dbghelp.dll"]
help = "CachyOS: which DLL OptiScaler injects as (default dxgi.dll)."
details = "Controls which proxy DLL OptiScaler hooks through. Try d3d12.dll or dbghelp.dll if dxgi.dll injection fails or conflicts with the game. Only meaningful with PROTON_USE_OPTISCALER=1."
example = "PROTON_USE_OPTISCALER=1 PROTON_OPTISCALER_NAME=d3d12.dll %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "PROTON_OPTISCALER_CONFIG"
category = "Upscaling & frame-gen"
default_value = ""
help = "CachyOS: write OptiScaler.ini settings inline, e.g. 'Upscalers.Dx12Upscaler=fsr31'."
details = "Pushes arbitrary OptiScaler.ini settings without editing the file by hand, as a semicolon-separated list of '{section}.{option}={value}' entries. Use it to pin the substitute upscaler or tune quality once OptiScaler is injected. Only meaningful with PROTON_USE_OPTISCALER=1. CachyOS-Proton only (added 11.0-20260601)."
example = "PROTON_USE_OPTISCALER=1 PROTON_OPTISCALER_CONFIG='Upscalers.Dx12Upscaler=fsr31;FSR.UpscaleRatio=2.0' %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "DXVK_NVAPI_VKREFLEX"
gpu = "nvidia"
category = "NVIDIA"
default_value = "1"
values = ["1", "0"]
help = "Enable DXVK-NVAPI's Vulkan Reflex layer (NVIDIA Reflex in Vulkan games)."
details = "Turns on DXVK-NVAPI's Vulkan Reflex layer so NVIDIA Reflex low-latency works in Vulkan/DXVK titles. Requires an NVIDIA GPU with NVAPI active (the default; don't set PROTON_DISABLE_NVAPI). Reduces input latency in supported games."
example = "DXVK_NVAPI_VKREFLEX=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "PROTON_NVIDIA_LIBS"
tier = "advanced"
gpu = "nvidia"
category = "NVIDIA"
default_value = "1"
values = ["1", "0"]
help = "CachyOS: enable alternative NVIDIA libraries (PhysX, CUDA, NVENC, etc.)."
details = "Enables CachyOS's alternative implementations of NVIDIA libraries (nvcuda, nvenc, PhysX, etc.) for hardware acceleration in games that need them. Use for titles relying on GPU PhysX or NVENC. Pair with PROTON_NVIDIA_LIBS_NO_32BIT on RTX 4000/5000-series cards if 32-bit games crash. CachyOS-Proton only."
example = "PROTON_NVIDIA_LIBS=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "PROTON_NVIDIA_LIBS_NO_32BIT"
tier = "advanced"
gpu = "nvidia"
category = "NVIDIA"
default_value = "1"
values = ["1", "0"]
help = "CachyOS: with PROTON_NVIDIA_LIBS, load only the 64-bit alt NVIDIA libraries."
details = "Companion to PROTON_NVIDIA_LIBS: restricts the alternative NVIDIA library implementations to their 64-bit versions only. Fixes bad performance or crashes in 32-bit games on RTX 4000/5000-series GPUs when PROTON_NVIDIA_LIBS is enabled. Has no effect on its own — set alongside PROTON_NVIDIA_LIBS=1. CachyOS-Proton only."
example = "PROTON_NVIDIA_LIBS=1 PROTON_NVIDIA_LIBS_NO_32BIT=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "PROTON_NVIDIA_NVML"
tier = "advanced"
gpu = "nvidia"
category = "NVIDIA"
default_value = "1"
values = ["1", "0"]
help = "CachyOS: alternative nvml.dll (GPU telemetry). On by default; set 0 to disable."
details = "Enables CachyOS's alternative nvml.dll so games/overlays that query NVIDIA GPU telemetry (clocks, temps, utilization) work under Proton. Enabled by default for NVIDIA GPUs; set 0 to disable if a game misbehaves when NVML is present. CachyOS-Proton only."
example = "PROTON_NVIDIA_NVML=0 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "PROTON_NVIDIA_NVCUDA"
tier = "advanced"
gpu = "nvidia"
category = "NVIDIA"
default_value = "1"
values = ["1", "0"]
help = "CachyOS: enable only the alternative nvcuda.dll (CUDA) without the rest of PROTON_NVIDIA_LIBS."
details = "Loads just CachyOS's alternative nvcuda.dll so games/tools that need CUDA (e.g. GPU PhysX, some AI/compute features) work, without pulling in the whole PROTON_NVIDIA_LIBS bundle. Use this when only CUDA is required and enabling all the alt libraries causes regressions. CachyOS-Proton only."
example = "PROTON_NVIDIA_NVCUDA=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "PROTON_NVIDIA_NVENC"
tier = "advanced"
gpu = "nvidia"
category = "NVIDIA"
default_value = "1"
values = ["1", "0"]
help = "CachyOS: enable only the alternative NVENC libraries (hardware video encode)."
details = "Loads just CachyOS's alternative NVENC (nvEncodeAPI) libraries so in-game recording/streaming that offloads H.264/HEVC/AV1 encoding to the NVIDIA GPU works under Proton, without the full PROTON_NVIDIA_LIBS bundle. Useful with Steam's game recording or an in-prefix encoder. CachyOS-Proton only."
example = "PROTON_NVIDIA_NVENC=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "PROTON_NVIDIA_NVOPTIX"
tier = "advanced"
gpu = "nvidia"
category = "NVIDIA"
default_value = "1"
values = ["1", "0"]
help = "CachyOS: enable only the alternative nvoptix.dll (OptiX ray-tracing denoiser)."
details = "Loads just CachyOS's alternative nvoptix.dll, giving games/tools access to NVIDIA's OptiX ray-tracing and AI denoiser without the full PROTON_NVIDIA_LIBS bundle. Niche — only a handful of titles use OptiX directly. CachyOS-Proton only."
example = "PROTON_NVIDIA_NVOPTIX=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

# ===================== Display / Wayland / HDR ====================

[[env]]
key = "PROTON_ENABLE_WAYLAND"
needs = ["wayland"]
category = "Display / Wayland / HDR"
default_value = "1"
values = ["1", "0"]
help = "Run on the native Wayland driver (no XWayland). Enables HDR without gamescope."
details = "Enables native Wayland driver support (winewayland.drv) instead of XWayland, allowing games to run natively on Wayland compositors. This is experimental and work-in-progress; expect potential issues with Steam Overlay, Steam Input, and some launchers (which may display as white windows). Benefits include HDR support without gamescope and improved latency/frame pacing on compatible systems. (PROTON_USE_WAYLAND is an accepted alias.)"
example = "PROTON_ENABLE_WAYLAND=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md#runtime-config-options"

[[env]]
key = "PROTON_WAYLAND_MONITOR"
tier = "advanced"
needs = ["wayland"]
category = "Display / Wayland / HDR"
default_value = ""
help = "Pin the game to a specific Wayland output, e.g. 'DP-3'."
details = "Pins a game window to a specific Wayland output/monitor by name (e.g., 'DP-3', 'HDMI-1'). Useful for multi-monitor setups to force the game to run on a particular display. Leave empty to allow automatic selection based on which monitor is most likely primary."
example = "PROTON_WAYLAND_MONITOR=DP-3 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md#runtime-config-options"

[[env]]
key = "ENABLE_GAMESCOPE_WSI"
category = "Display / Wayland / HDR"
default_value = "1"
values = ["1", "0"]
help = "Use the gamescope WSI layer for better presentation when running under gamescope."
details = "Uses the gamescope WSI (Window System Integration) layer for improved presentation and synchronization when running a game under gamescope. Enhances frame pacing and reduces latency in gamescope sessions; has no effect when not using gamescope."
example = "ENABLE_GAMESCOPE_WSI=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md#runtime-config-options"

[[env]]
key = "DXVK_HDR"
needs = ["hdr"]
category = "Display / Wayland / HDR"
default_value = "1"
values = ["1", "0"]
help = "Enable HDR output (the modern switch; PROTON_ENABLE_HDR was removed)."
details = "Enables HDR for DXVK/VKD3D games. Requires an HDR-capable display plus either gamescope with --hdr-enabled or PROTON_ENABLE_WAYLAND=1. This is the current HDR toggle; recent proton-cachyos also auto-detects HDR (force off with DXVK_NO_HDR=1). The old PROTON_ENABLE_HDR alias has been removed."
example = "PROTON_ENABLE_WAYLAND=1 DXVK_HDR=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "ENABLE_HDR_WSI"
gpu = "nvidia"
needs = ["hdr"]
category = "Display / Wayland / HDR"
default_value = "1"
values = ["1", "0"]
help = "Enable the HDR WSI layer — needed for HDR on older NVIDIA drivers."
details = "Turns on the HDR Window System Integration layer, which older NVIDIA drivers require before DXVK_HDR output will work. Set alongside DXVK_HDR=1 if HDR won't engage on an NVIDIA GPU; unnecessary on recent drivers and on AMD/Intel. Requires an HDR-capable display."
example = "DXVK_HDR=1 ENABLE_HDR_WSI=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "DXVK_NO_HDR"
tier = "advanced"
category = "Display / Wayland / HDR"
default_value = "1"
values = ["1", "0"]
help = "Force-disable HDR if it gets auto-enabled."
details = "Forcefully disables HDR output even when it would otherwise be auto-detected and enabled. Use when automatic HDR causes washed-out or incorrect colors on your game or display."
example = "DXVK_NO_HDR=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "WINE_FULLSCREEN_INTEGER_SCALING"
tier = "advanced"
category = "Display / Wayland / HDR"
default_value = "1"
values = ["1", "0"]
help = "Integer-scale fullscreen for sharp, pixel-perfect upscaling."
details = "Enables integer scaling for fullscreen games so low-resolution output is scaled by whole numbers, keeping pixels crisp (ideal for pixel-art / retro titles). No effect when the game's resolution already matches the display."
example = "WINE_FULLSCREEN_INTEGER_SCALING=1 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

[[env]]
key = "WINE_USE_KWIN_HACKS"
tier = "advanced"
needs = ["kde"]
category = "Display / Wayland / HDR"
default_value = "1"
values = ["1", "0"]
help = "Enable KDE/KWin-specific windowing hacks for smoother Wayland/X11."
details = "Turns on KDE Plasma (KWin) specific windowing workarounds that improve fullscreen and window-focus behavior under Wayland or X11. Useful on Plasma desktops where games misbehave with fullscreen toggling."
example = "WINE_USE_KWIN_HACKS=1 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

[[env]]
key = "WINE_DISABLE_VULKAN_OPWR"
tier = "advanced"
category = "Display / Wayland / HDR"
default_value = "1"
values = ["1", "0"]
help = "Disable Vulkan other-process window rendering to fix some Wayland rendering glitches."
details = "Disables Wine's Vulkan 'other process window rendering' (OPWR) path, which can cause black or flickering windows for child-process/overlay surfaces under Wayland. Enable if a game (or its launcher) renders nothing or flickers when running with PROTON_ENABLE_WAYLAND=1."
example = "PROTON_ENABLE_WAYLAND=1 WINE_DISABLE_VULKAN_OPWR=1 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

# =========================== Anti-cheat ==========================

[[env]]
key = "PROTON_EAC_RUNTIME"
category = "Anti-cheat"
default_value = "1"
values = ["1", "0"]
help = "Toggle the bundled Easy Anti-Cheat runtime."
details = "Controls whether Proton's bundled Easy Anti-Cheat (EAC) runtime is enabled for games that use EAC protection. Setting to 0 disables the bundled EAC, which may cause anti-cheat to fail on EAC-protected games. Only disable if you're troubleshooting EAC compatibility issues or using a system-wide EAC installation."
example = "PROTON_EAC_RUNTIME=0 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

[[env]]
key = "PROTON_BATTLEYE_RUNTIME"
category = "Anti-cheat"
default_value = "1"
values = ["1", "0"]
help = "Toggle the bundled BattlEye runtime."
details = "Controls whether Proton's bundled BattlEye runtime is enabled for games that use BattlEye anti-cheat protection. Setting to 0 disables the bundled BattlEye, which may cause anti-cheat to fail on BattlEye-protected games. Only disable if you're troubleshooting BattlEye compatibility issues or using a system-wide BattlEye installation."
example = "PROTON_BATTLEYE_RUNTIME=0 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

# ============================== DXVK =============================

[[env]]
key = "DXVK_HUD"
category = "DXVK"
default_value = "fps"
values = ["fps", "full", "compiler", "1", "0"]
help = "Built-in DXVK overlay, e.g. 'fps', 'full', 'compiler'."
details = "Displays an in-game overlay with performance and debugging information. Can show FPS, frame times, GPU memory, shader compilation activity, and other metrics. Accepts comma-separated values like 'fps', 'full' (all elements), 'compiler', or '1' (shorthand for devinfo+fps)."
example = "DXVK_HUD=fps,memory %command%"
url = "https://github.com/doitsujin/dxvk/blob/master/README.md#hud"

[[env]]
key = "DXVK_CONFIG_FILE"
tier = "advanced"
category = "DXVK"
default_value = ""
help = "Path to a dxvk.conf for per-game DXVK tuning."
details = "Specifies a path to a dxvk.conf configuration file for per-game DXVK tuning. This file allows detailed control over rendering behavior without environment variables. Paths are relative to the game working directory unless absolute."
example = "DXVK_CONFIG_FILE=/home/user/.config/dxvk/myconfig.conf %command%"
url = "https://github.com/doitsujin/dxvk/blob/master/README.md#debugging"

[[env]]
key = "DXVK_SHADER_CACHE"
category = "DXVK"
default_value = "1"
values = ["1", "0"]
help = "Toggle DXVK's internal shader cache (was DXVK_STATE_CACHE in older DXVK)."
details = "Enables or disables DXVK's internal shader cache, which stores compiled pipeline states to speed up subsequent game launches. Disabling it saves disk space and avoids stale cache issues, but increases load times. Default on; set to 0 to disable. This is current DXVK's name for the option — the older DXVK_STATE_CACHE spelling no longer exists in current DXVK."
example = "DXVK_SHADER_CACHE=0 %command%"
url = "https://github.com/doitsujin/dxvk/blob/master/README.md#debugging"

[[env]]
key = "DXVK_FILTER_DEVICE_NAME"
tier = "advanced"
category = "DXVK"
default_value = ""
help = "Force a specific GPU by substring of its Vulkan device name."
details = "Forces DXVK to use a specific GPU by matching a substring of its Vulkan device name. Useful on multi-GPU systems where the game picks the wrong adapter. The string is case-sensitive and matches the first GPU with a matching name substring."
example = "DXVK_FILTER_DEVICE_NAME=RTX3080 %command%"
url = "https://github.com/doitsujin/dxvk/blob/master/README.md#device-filter"

[[env]]
key = "DXVK_FILTER_DEVICE_UUID"
tier = "advanced"
category = "DXVK"
default_value = ""
help = "Force a specific GPU by exact Vulkan device UUID (32 hex chars, no dashes)."
details = "Forces DXVK to use a specific GPU by its exact Vulkan device UUID, a precise alternative to DXVK_FILTER_DEVICE_NAME's substring match. Find your GPU's UUID with `vulkaninfo | grep deviceUUID`. Useful on multi-GPU systems (e.g. hybrid laptops or multiple discrete cards) where a name substring is ambiguous."
example = "DXVK_FILTER_DEVICE_UUID=00000000000000000000000000000000 %command%"
url = "https://github.com/doitsujin/dxvk/blob/master/README.md#device-filter"

[[env]]
key = "DXVK_SHADER_CACHE_PATH"
tier = "advanced"
category = "DXVK"
default_value = ""
help = "Directory for DXVK's on-disk shader cache (default: game working directory)."
details = "Overrides where DXVK writes its on-disk shader cache, instead of the game's working directory. Useful for redirecting caches to faster storage (e.g. an NVMe drive) or consolidating them outside per-game folders. Pair with DXVK_SHADER_CACHE=0 to disable caching entirely instead."
example = "DXVK_SHADER_CACHE_PATH=/home/user/.cache/dxvk %command%"
url = "https://github.com/doitsujin/dxvk/blob/master/README.md#hud"

[[env]]
key = "DXVK_CONFIG"
tier = "advanced"
category = "DXVK"
default_value = ""
help = "Set dxvk.conf options inline, e.g. 'dxgi.maxFrameLatency=1;dxvk.hud=fps'."
details = "Applies dxvk.conf settings directly from the environment as a semicolon-separated list of key=value pairs, so you don't need a separate config file (unlike DXVK_CONFIG_FILE). Handy one-offs include dxgi.maxFrameLatency=1 (lower input lag), dxvk.maxFrameRate=60 (cap the frame rate — there is no standalone DXVK_FRAME_RATE variable), and dxvk.enableGraphicsPipelineLibrary. Values here override the config file."
example = "DXVK_CONFIG='dxvk.maxFrameRate=60;dxgi.syncInterval=0' %command%"
url = "https://github.com/doitsujin/dxvk/blob/master/dxvk.conf"

[[env]]
key = "PROTON_LOCAL_SHADER_CACHE"
tier = "advanced"
category = "DXVK"
default_value = "1"
values = ["1", "0"]
help = "CachyOS: keep a per-game shader cache independent of Steam's cache setting."
details = "Stores the DXVK/VKD3D shader cache per game, local to the prefix, instead of relying on Steam's shared shader-cache management. Useful when Steam's shader cache is disabled or keeps getting purged, or to keep a stable cache across driver updates. CachyOS-Proton only."
example = "PROTON_LOCAL_SHADER_CACHE=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

# ============================== VKD3D ============================

[[env]]
key = "VKD3D_CONFIG"
tier = "advanced"
category = "VKD3D (D3D12)"
default_value = "dxr"
values = ["dxr", "nodxr", "dxr12", "descriptor_heap", "no_upload_hvv", "force_static_cbv", "single_queue"]
help = "Comma-separated vkd3d-proton tweaks, e.g. 'dxr' to force-enable ray tracing."
details = "A comma- or semicolon-separated list of options that modify vkd3d-proton behavior. Common ones: 'dxr' (force-enable ray tracing even when considered unsafe; DXR is normally auto-detected), 'nodxr' (disable it), 'dxr12' (experimental DXR 1.2 support), 'no_upload_hvv' (avoid host-visible VRAM for upload heaps on constrained GPUs), 'force_static_cbv' (NVIDIA constant-buffer optimization), 'single_queue' (disable async compute/transfer), and 'descriptor_heap' (CachyOS-only descriptor-heap path; this replaced the old PROTON_VKD3D_HEAP knob). Most games run fine with defaults — use this for advanced features or specific workarounds."
example = "VKD3D_CONFIG=dxr %command%"
url = "https://github.com/HansKristian-Work/vkd3d-proton/blob/master/README.md#environment-variables"

[[env]]
key = "VKD3D_FRAME_RATE"
tier = "advanced"
category = "VKD3D (D3D12)"
default_value = "60"
help = "Cap the frame rate via vkd3d-proton for D3D12 games (0 = uncapped)."
details = "Caps the frame rate at the vkd3d-proton level for Direct3D 12 titles — the D3D12 counterpart to DXVK's frame-rate limiting (dxvk.maxFrameRate via DXVK_CONFIG). Set to 0 to disable the cap. Useful for reducing heat/power draw on laptops or forcing consistent frame pacing."
example = "VKD3D_FRAME_RATE=60 %command%"
url = "https://github.com/HansKristian-Work/vkd3d-proton/blob/master/README.md#environment-variables"

[[env]]
key = "VKD3D_FEATURE_LEVEL"
tier = "advanced"
category = "VKD3D (D3D12)"
default_value = "12_2"
values = ["12_0", "12_1", "12_2"]
help = "Override the reported D3D12 feature level."
details = "Overrides the reported Direct3D 12 feature level, allowing you to force the game to use a lower feature level (e.g., 12_0, 12_1) for compatibility. Supported values are 11_0, 11_1, 12_0, 12_1, 12_2. Useful when a game crashes or has bugs due to assuming higher-level GPU capabilities than your driver actually exposes."
example = "VKD3D_FEATURE_LEVEL=12_0 %command%"
url = "https://github.com/HansKristian-Work/vkd3d-proton/blob/master/libs/vkd3d/device.c"

[[env]]
key = "VKD3D_SHADER_MODEL"
tier = "advanced"
category = "VKD3D (D3D12)"
default_value = "6_6"
values = ["6_0", "6_5", "6_6", "6_7"]
help = "Override the reported D3D12 shader model."
details = "Overrides the maximum reported Direct3D 12 shader model version, capping the shader language features available to the game. Supported values are 5_1, 6_0, 6_1, 6_2, 6_3, 6_4, 6_5, 6_6, 6_7, 6_8. Use this to force games to use simpler shaders if they fail with advanced shader features or to work around driver issues with newer shader models."
example = "VKD3D_SHADER_MODEL=6_5 %command%"
url = "https://github.com/HansKristian-Work/vkd3d-proton/blob/master/libs/vkd3d/device.c"

[[env]]
key = "VKD3D_DEBUG"
tier = "advanced"
category = "VKD3D (D3D12)"
default_value = "warn"
values = ["none", "err", "warn", "info"]
help = "vkd3d-proton log verbosity."
details = "Controls the verbosity of vkd3d-proton debug logging output. Accepts 'none' (silent), 'err' (errors only), 'warn' (warnings and errors), 'info' (informational), 'fixme', and 'trace' (very verbose). Default is 'warn'. Increasing verbosity helps diagnose compatibility issues but may impact performance slightly and generate large log files."
example = "VKD3D_DEBUG=warn %command%"
url = "https://github.com/HansKristian-Work/vkd3d-proton/blob/master/README.md#environment-variables"

[[env]]
key = "VKD3D_FILTER_DEVICE_NAME"
tier = "advanced"
category = "VKD3D (D3D12)"
default_value = ""
help = "Force a specific GPU by substring of its Vulkan device name (D3D12 titles)."
details = "Skips Vulkan devices whose name doesn't contain this substring — the vkd3d-proton counterpart to DXVK_FILTER_DEVICE_NAME, for Direct3D 12 titles. Useful on multi-GPU systems where the game picks the wrong adapter."
example = "VKD3D_FILTER_DEVICE_NAME=RTX3080 %command%"
url = "https://github.com/HansKristian-Work/vkd3d-proton/blob/master/README.md#environment-variables"

[[env]]
key = "VKD3D_VULKAN_DEVICE"
tier = "advanced"
category = "VKD3D (D3D12)"
default_value = ""
help = "Force a specific GPU by zero-based Vulkan device index (D3D12 titles)."
details = "Forces vkd3d-proton to use the Vulkan device at this zero-based index, an alternative to VKD3D_FILTER_DEVICE_NAME when you know the enumeration order (check with `vulkaninfo --summary`). Useful for pinning a D3D12 game to a specific GPU on multi-GPU systems."
example = "VKD3D_VULKAN_DEVICE=0 %command%"
url = "https://github.com/HansKristian-Work/vkd3d-proton/blob/master/README.md#environment-variables"

# ====================== Wine / DLL overrides =====================

[[env]]
key = "WINEDLLOVERRIDES"
tier = "advanced"
category = "Wine / Overrides"
default_value = ""
help = "Override DLL load mode, e.g. 'winmm=n,b' (native then builtin)."
details = "Controls how Wine loads DLLs (Dynamic Link Libraries), specifying whether to use native Windows DLLs or Wine's built-in replacements. Syntax is DllName=mode, comma-separated, where modes are: n (native only), b (builtin only), n,b (try native first, fall back to builtin), b,n (try builtin first). Commonly used to disable problematic DLLs (e.g., mscoree=d to disable Mono/.NET) or force specific implementations for compatibility."
example = "WINEDLLOVERRIDES=mscoree=d;mshtml=d %command%"
url = "https://wiki.archlinux.org/title/Wine"

[[env]]
key = "WINEDEBUG"
tier = "advanced"
category = "Wine / Overrides"
default_value = "-all"
values = ["-all", "fixme-all", "+seh", "warn+all"]
help = "Wine debug channels; '-all' silences logs for a small perf win."
details = "Controls Wine debug logging verbosity and channel filtering. Set to '-all' to silence all debug output for a small performance gain; use '+channelname' to enable a channel or '-channelname' to disable it. Common values: '-all' (quiet), '+seh' (enable SEH exceptions), 'warn+all' (all warnings), 'fixme-all' (all fixme messages). Useful for troubleshooting game crashes or compatibility issues when you need console output."
example = "WINEDEBUG=warn+all %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

[[env]]
key = "WINE_BLOCK_HOSTS"
tier = "advanced"
category = "Wine / Overrides"
default_value = ""
help = "Block the game from reaching listed hosts (telemetry/DRM), comma-separated (max 16)."
details = "Blocks network access to the listed hostnames from inside the prefix — handy for stopping telemetry or a broken DRM/phone-home check that stalls launch. Comma- or semicolon-separated, up to 16 hosts; a second-level domain blocks its subdomains too (e.g. 'test.org' also blocks '*.test.org')."
example = "WINE_BLOCK_HOSTS=telemetry.example.com,ads.example.net %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

# ==================== Overlay / Post-processing ==================
#
# vkBasalt is a Vulkan *implicit layer*, not a wrapper program, so it needs no
# [[wrapper]] entry and no `requires` (there is no binary on PATH to find — it
# ships a libvkbasalt.so plus a layer JSON).

[[env]]
key = "ENABLE_VKBASALT"
category = "Overlay / Post-processing"
default_value = "1"
values = ["1", "0"]
help = "Turn on vkBasalt post-processing (CAS sharpening, FXAA, SMAA, ReShade FX)."
details = "Activates the vkBasalt Vulkan layer, which applies post-processing effects on top of the game's output — most commonly AMD FidelityFX CAS sharpening, but also FXAA, SMAA and ReShade-style .fx shaders. The effects themselves are chosen in vkBasalt.conf, not here; this variable only enables the layer. Pairs well with an upscaler (FSR/XeSS), where a little sharpening offsets the softness upscaling introduces. The in-game toggle key (HOME by default) needs raw X11 input and does nothing on a pure Wayland session — the layer itself works either way."
example = "ENABLE_VKBASALT=1 %command%"
url = "https://github.com/DadSchoorse/vkBasalt"

[[env]]
key = "VKBASALT_CONFIG_FILE"
tier = "advanced"
category = "Overlay / Post-processing"
default_value = ""
help = "Path to a specific vkBasalt.conf (otherwise the standard search path is used)."
details = "Points vkBasalt at one config file instead of letting it search. Without this it tries, in order: the game's working directory, $XDG_CONFIG_HOME/vkBasalt/vkBasalt.conf (~/.config/vkBasalt/vkBasalt.conf), $XDG_DATA_HOME/vkBasalt/vkBasalt.conf, /etc/vkBasalt.conf, /etc/vkBasalt/vkBasalt.conf, then /usr/share/vkBasalt/vkBasalt.conf. Use it to keep a per-game effect chain. As with MANGOHUD_CONFIGFILE the path must be absolute — '~' is not expanded in Steam launch options."
example = "ENABLE_VKBASALT=1 VKBASALT_CONFIG_FILE=/home/user/.config/vkBasalt/sharpen.conf %command%"
url = "https://github.com/DadSchoorse/vkBasalt#configuration"

[[env]]
key = "VKBASALT_LOG_LEVEL"
tier = "advanced"
category = "Overlay / Post-processing"
default_value = "info"
values = ["trace", "debug", "info", "warn", "error", "none"]
help = "vkBasalt log verbosity — raise it when an effect silently fails to load."
details = "Controls how much vkBasalt reports. The useful case is a shader or effect that appears to do nothing: at 'debug' or 'trace' the layer says which config file it actually read and which effects it managed to compile, which is usually the whole answer. Set 'none' to silence it."
example = "ENABLE_VKBASALT=1 VKBASALT_LOG_LEVEL=debug %command%"
url = "https://github.com/DadSchoorse/vkBasalt"

[[env]]
key = "VKBASALT_LOG_FILE"
tier = "advanced"
category = "Overlay / Post-processing"
default_value = ""
help = "Send vkBasalt's log to a file instead of stderr."
details = "Redirects vkBasalt's output to the given path. Worth setting when debugging through Steam, where stderr goes to the Steam console rather than anywhere you can easily read it. Absolute paths only — '~' is not expanded in Steam launch options."
example = "ENABLE_VKBASALT=1 VKBASALT_LOG_LEVEL=debug VKBASALT_LOG_FILE=/tmp/vkbasalt.log %command%"
url = "https://github.com/DadSchoorse/vkBasalt"

# ============================= Logging ===========================

[[env]]
key = "PROTON_LOG"
category = "Logging / Debug"
default_value = "1"
values = ["1", "0"]
help = "Write a Proton log to ~/steam-<appid>.log for debugging."
details = "Enables Proton debug logging to a file at ~/steam-<appid>.log (or the directory specified by PROTON_LOG_DIR). Set to 1 for default logging, or specify a string to append to WINEDEBUG channels for custom debug output. Useful for troubleshooting game compatibility issues and crashes."
example = "PROTON_LOG=1 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

[[env]]
key = "PROTON_LOG_DIR"
tier = "advanced"
category = "Logging / Debug"
default_value = ""
help = "Directory for Proton logs (overrides the default home location)."
details = "Specifies the output directory for Proton log files created by PROTON_LOG. If not set, logs default to the home directory. Useful for organizing logs or writing to a non-standard location."
example = "PROTON_LOG_DIR=/tmp/proton_logs PROTON_LOG=1 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

[[env]]
key = "PROTON_WAIT_ATTACH"
tier = "advanced"
category = "Logging / Debug"
default_value = "1"
values = ["1", "0"]
help = "Pause before launch so you can attach a debugger (advanced troubleshooting)."
details = "Makes Proton wait at startup before executing the game, giving you time to attach a debugger (e.g. winedbg/gdb) to the process. Purely a development/troubleshooting aid — the game appears to hang until a debugger connects. Leave off for normal play."
example = "PROTON_WAIT_ATTACH=1 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

[[env]]
key = "MANGOHUD_CONFIG"
category = "Logging / Debug"
default_value = "fps_limit=0,cpu_temp,gpu_temp,ram,vram"
help = "MangoHud overlay config (comma-separated). Pairs with the MangoHud wrapper."
details = "Configures the MangoHud overlay display via comma-separated options (takes priority over config files). Enables in-game monitoring of FPS, CPU/GPU temperature, memory, and other metrics. Common options include fps, cpu_temp, gpu_temp, ram, vram; use 'full' for comprehensive monitoring."
example = "MANGOHUD_CONFIG=fps,cpu_temp,gpu_temp,ram,vram mangohud %command%"
url = "https://github.com/flightlessmango/MangoHud/blob/master/README.md"

[[env]]
key = "MANGOHUD_CONFIGFILE"
tier = "advanced"
category = "Logging / Debug"
default_value = ""
help = "Path to a MangoHud .conf file (used when MANGOHUD_CONFIG is unset)."
details = "Points MangoHud at an on-disk config file instead of the inline MANGOHUD_CONFIG string. Handy for reusing a hand-tuned overlay (position, colours, metrics) kept in ~/.config/MangoHud/MangoHud.conf. Note MANGOHUD_CONFIG, if set, takes priority over the file, so leave it unset when loading a preset. The path must be absolute — '~' is not expanded in Steam launch options."
example = "MANGOHUD_CONFIGFILE=/home/user/.config/MangoHud/MangoHud.conf mangohud %command%"
url = "https://github.com/flightlessmango/MangoHud/blob/master/README.md#environment-variables"

[[env]]
key = "PROTON_CRASH_REPORT_DIR"
tier = "advanced"
category = "Logging / Debug"
default_value = ""
help = "Write Proton/Wine crash reports into this directory."
details = "Writes crash logs/backtraces into the specified directory instead of the default location. Handy for collecting reproducible crash data when filing bug reports or bisecting a problematic game."
example = "PROTON_CRASH_REPORT_DIR=/tmp/proton-crashes %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

# ============================== Audio ============================

[[env]]
key = "PROTON_USE_PIPEWIRE"
category = "Audio"
default_value = "1"
values = ["1", "0"]
help = "CachyOS: use the native PipeWire audio driver (winepipewire.drv). On by default."
details = "Routes game audio through Wine's native PipeWire driver (winepipewire.drv) instead of going via PulseAudio. Enabled by default in proton-cachyos 11.0-20260702 and generally gives lower-latency, more reliable audio on PipeWire systems. Set 0 to fall back to the PulseAudio driver if a game has audio glitches, no sound, or device-selection issues. CachyOS-Proton only."
example = "PROTON_USE_PIPEWIRE=0 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "WINE_AUDIO_DRIVER"
tier = "advanced"
category = "Audio"
default_value = "pipewire,pulse,alsa"
values = ["pipewire,pulse,alsa", "pulse,alsa", "pulse", "alsa"]
help = "Preferred Wine audio driver order (default pipewire,pulse,alsa)."
details = "Comma-separated preference list of Wine audio backends; Wine uses the first one that initializes. Defaults to 'pipewire,pulse,alsa'. Force a specific backend (e.g. 'pulse') when auto-selection lands on a driver that crackles or fails to open your device. CachyOS-Proton only."
example = "WINE_AUDIO_DRIVER=pulse %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "WINEALSA_SPATIAL"
tier = "advanced"
category = "Audio"
default_value = "1"
values = ["1", "0"]
help = "Correctly downmix spatial / surround audio through the ALSA driver."
details = "Enables proper downmixing of spatial (surround) audio when using the ALSA backend, fixing missing channels or wrong mixing in games that output 5.1/7.1. Only relevant with the ALSA driver; pair with WINEALSA_CHANNELS to match your speaker layout. CachyOS-Proton only."
example = "WINE_AUDIO_DRIVER=alsa WINEALSA_SPATIAL=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "WINEALSA_CHANNELS"
tier = "advanced"
category = "Audio"
default_value = "6"
values = ["2", "4", "6", "8"]
help = "Channel count for the ALSA driver (2=stereo, 6=5.1, 8=7.1)."
details = "Sets the number of output channels for the ALSA audio backend so surround setups get the right layout (2 = stereo, 4 = quad, 6 = 5.1, 8 = 7.1). Only relevant with the ALSA driver and typically paired with WINEALSA_SPATIAL. CachyOS-Proton only."
example = "WINE_AUDIO_DRIVER=alsa WINEALSA_CHANNELS=6 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

# ====================== Compatibility / Misc =====================

[[env]]
key = "PROTON_ADD_CONFIG"
tier = "advanced"
category = "Compatibility / Misc"
default_value = ""
values = ["nativevulkanloader", "vkd3dfl12", "vkd3dbindlesstb", "oldglstr", "noforcelgadd"]
help = "CachyOS: apply umu compat-config keywords instead of raw env vars (comma-separated)."
details = "Added in 11.0-20260702: supplies Proton's built-in compatibility configs — the same fixes umu-protonfixes applies per game — as a comma-separated list, so you don't have to hand-set the underlying env vars. Useful keywords: 'nativevulkanloader' (use the game's own Vulkan loader instead of Proton's), 'vkd3dfl12' (force D3D12 feature level 12), 'vkd3dbindlesstb' (adds force_bindless_texel_buffer to VKD3D_CONFIG), 'oldglstr' (limit the GL extension-string length for old games), and 'noforcelgadd' (disable the forced LARGE_ADDRESS_AWARE flag). There is also 'cmdlineappend:<arg>' to append a launch argument (escape commas/backslashes). CachyOS-Proton only."
example = "PROTON_ADD_CONFIG=nativevulkanloader,vkd3dfl12 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "PROTON_SET_GAME_DRIVE"
category = "Compatibility / Misc"
default_value = "1"
values = ["1", "0"]
help = "Expose the game's Steam library as an S: drive inside the prefix."
details = "Creates an S: drive in the Wine prefix pointing at the Steam library folder that contains the game. Helps titles or mod tools that expect a fixed drive letter or absolute Windows-style paths."
example = "PROTON_SET_GAME_DRIVE=1 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

[[env]]
key = "PROTON_OLD_GL_STRING"
tier = "advanced"
category = "Compatibility / Misc"
default_value = "1"
values = ["1", "0"]
help = "Limit the GL extension-string length for old games that crash on long strings."
details = "Shortens the reported OpenGL extension string, which some old games parse into a fixed-size buffer and crash on otherwise. Enable only if an old GL game crashes at startup with no other explanation."
example = "PROTON_OLD_GL_STRING=1 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

[[env]]
key = "PROTON_NO_WM_DECORATION"
category = "Compatibility / Misc"
default_value = "1"
values = ["1", "0"]
help = "Use Wine's own window decorations instead of the window manager's."
details = "Disables window-manager decorations and lets Wine draw its own. Can fix borderless/fullscreen and title-bar glitches on some compositors, or give consistent window borders across desktops."
example = "PROTON_NO_WM_DECORATION=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "PROTON_DISCORD_BRIDGE"
tier = "advanced"
category = "Compatibility / Misc"
default_value = "1"
values = ["1", "0"]
help = "CachyOS: enable Discord Rich Presence for Proton games (rpc-bridge)."
details = "Enables the rpc-bridge so Discord Rich Presence works for games running under Proton, showing the game you're playing in Discord. Added in proton-cachyos 11.0-20260519. CachyOS-Proton only."
example = "PROTON_DISCORD_BRIDGE=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "PROTON_USE_SDL"
category = "Compatibility / Misc"
default_value = "1"
values = ["1", "0"]
help = "CachyOS: use SDL input instead of HIDRAW/Steam Input for controllers."
details = "Routes controller input through SDL rather than HIDRAW/Steam Input. Try this when a gamepad isn't detected, has wrong mappings, or double-inputs under the default path. CachyOS-Proton only. (Alias for PROTON_PREFER_SDL.)"
example = "PROTON_USE_SDL=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "PROTON_NO_STEAMINPUT"
category = "Compatibility / Misc"
default_value = "1"
values = ["1", "0"]
help = "Disable Steam Input entirely (fixes doubled or fighting controller input)."
details = "Stops Proton from hooking Steam Input, so the game sees the raw controller directly. Use when Steam Input conflicts with a game's own controller handling — symptoms include doubled inputs, phantom buttons, or a gamepad that fights itself. Leave off if you rely on Steam Input remapping."
example = "PROTON_NO_STEAMINPUT=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "PROTON_USE_XALIA"
tier = "advanced"
category = "Compatibility / Misc"
default_value = "1"
values = ["1", "0"]
help = "Toggle the Xalia gamepad-UI layer that makes mouse/keyboard menus controller-navigable."
details = "Xalia overlays a gamepad-navigable UI on top of Wine dialogs and launchers that were built for mouse and keyboard, so you can drive installers and config screens with a controller (handy on Steam Deck / couch setups). It is enabled dynamically by default; set 0 to turn it off if it interferes with a game's own controller handling, or 1 to force it on."
example = "PROTON_USE_XALIA=0 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

[[env]]
key = "PROTON_MEDIA_FORCE_GST"
category = "Compatibility / Misc"
default_value = "1"
values = ["1", "0"]
help = "Force GStreamer for media to fix missing/black cutscene video."
details = "Forces media playback through GStreamer, which fixes black or missing pre-rendered cutscenes/FMVs in some games. Enable if intro movies or in-game videos don't play."
example = "PROTON_MEDIA_FORCE_GST=1 %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "PROTON_GST_VIDEO_ORIENTATION"
tier = "advanced"
category = "Compatibility / Misc"
default_value = "clockwise"
values = ["none", "clockwise", "rotate-180", "counterclockwise", "horizontal-flip", "vertical-flip", "automatic"]
help = "Rotate/flip GStreamer-rendered video (fixes sideways or upside-down cutscenes)."
details = "Changes the orientation of videos rendered through GStreamer, using the same values as GStreamer's videoflip plugin. Fixes cutscenes or FMVs that play back sideways or upside-down under Proton. Only affects titles already routed through PROTON_MEDIA_FORCE_GST."
example = "PROTON_MEDIA_FORCE_GST=1 PROTON_GST_VIDEO_ORIENTATION=clockwise %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/README.md"

[[env]]
key = "HOST_LC_ALL"
category = "Compatibility / Misc"
default_value = ""
values = ["C", "ja_JP.UTF-8", "zh_CN.UTF-8", "ko_KR.UTF-8"]
help = "Override the locale passed to the game (e.g. for JP/CJK text or date handling)."
details = "Overrides the system locale seen by the game, without changing your desktop locale. Useful for Japanese/CJK titles that need a matching locale for correct text, fonts, or date parsing (set e.g. ja_JP.UTF-8). Leave empty to inherit the system locale."
example = "HOST_LC_ALL=ja_JP.UTF-8 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

[[env]]
key = "WINE_DO_NOT_CREATE_DXGI_DEVICE_MANAGER"
tier = "advanced"
category = "Compatibility / Misc"
default_value = "1"
values = ["1", "0"]
help = "Work around video glitches from incomplete IMFDXGIDeviceManager support."
details = "Stops Wine from creating a DXGI device manager, working around video/playback corruption in games that use Media Foundation with incomplete IMFDXGIDeviceManager support. Enable if videos render garbled."
example = "WINE_DO_NOT_CREATE_DXGI_DEVICE_MANAGER=1 %command%"
url = "https://github.com/ValveSoftware/Proton/blob/proton_11.0/README.md"

[[env]]
key = "PROTON_DLL_COPY"
tier = "advanced"
category = "Compatibility / Misc"
default_value = ""
values = ["*"]
help = "Copy all DLLs into the prefix instead of symlinking (fixes some custom protonfixes)."
details = "Forces Proton to copy every DLL into the wineprefix instead of the normal symlink-into-prefix behavior. Needed if you run custom local protonfixes that install a .NET runtime (per umu-protonfixes#557) via the command line rather than Steam's built-in fixes. Considerably increases prefix size, so leave it unset unless you hit missing-DLL errors from a custom fix. Must be quoted on the command line: PROTON_DLL_COPY=\"*\"."
example = "PROTON_DLL_COPY=\"*\" %command%"
url = "https://github.com/CachyOS/proton-cachyos/blob/cachyos_main/CHANGELOG.md"
