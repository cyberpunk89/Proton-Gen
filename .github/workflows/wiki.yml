name: Sync wiki

# The wiki is generated from docs/wiki/ in this repo — see scripts/sync-wiki.sh.
# Editing a page in the browser will be overwritten by the next run.
#
# Note: this cannot succeed until the wiki repo exists, which GitHub only creates
# after the first page is saved via https://github.com/<owner>/<repo>/wiki/_new.

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**"]
  workflow_dispatch: {}

permissions:
  contents: write

# A second push while one sync is in flight would race on the wiki remote.
concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push docs/wiki to the wiki
        env:
          WIKI_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: ./scripts/sync-wiki.sh
